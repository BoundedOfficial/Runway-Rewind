<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{project.title}}</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: radial-gradient(ellipse at center, #c5c6a2, #7d896b); }
    #app-container { position: absolute; overflow: hidden; }
    #canvas { display: block; width: 100%; outline: none; touch-action: none; }
    #game-loading { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; color: #232d22; font: 1rem system-ui, sans-serif; }
    #development-controls { position: fixed; top: 8px; right: 8px; display: flex; gap: 4px; }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="canvas-container">
      <canvas id="canvas" width="{{display.width}}" height="{{display.height}}" tabindex="0" aria-label="Runway Rewind makeover game"></canvas>
    </div>
  </div>
  <div id="game-loading" role="status">Loading makeover...</div>
  <script src="playgama-bridge.js"></script>
  <script src="runway-platform.js"></script>
  <script src="dmloader.js"></script>
  <script>
    const loading = document.getElementById("game-loading");
    CUSTOM_PARAMETERS.start_error = () => { loading.textContent = "The makeover could not load."; };
    CUSTOM_PARAMETERS.unsupported_webgl_callback = () => {
      loading.textContent = "WebGL is required to play Runway Rewind.";
    };
    const resizeGame = CUSTOM_PARAMETERS.resize_window_callback;
    CUSTOM_PARAMETERS.resize_window_callback = () => runwayPlatform.resize(resizeGame);
    runwayPlatform.initialize().then(() => EngineLoader.load("canvas", "{{exe-name}}"));
  </script>
</body>
</html>
