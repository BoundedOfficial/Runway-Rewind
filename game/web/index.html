<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{project.title}}</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: radial-gradient(ellipse at 50% 35%, #d6cfef 45%, #c4bbdf 100%); }
    #app-container { position: absolute; overflow: hidden; }
    #canvas-container { height: 100%; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #game-loading { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; color: #232d22; font: 1rem system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="canvas-container">
      <canvas id="canvas" width="{{display.width}}" height="{{display.height}}" tabindex="0" aria-label="Runway Rewind makeover game"></canvas>
    </div>
  </div>
  <div id="game-loading" role="status">Loading makeover...</div>
  <script src="playgama-bridge.js"></script>
  <script src="runway-platform.js"></script>
  <script src="runway-development.js"></script>
  <script src="dmloader.js"></script>
  <script>
    const loading = document.getElementById("game-loading");
    CUSTOM_PARAMETERS.start_error = () => { loading.textContent = "The makeover could not load."; };
    CUSTOM_PARAMETERS.unsupported_webgl_callback = () => {
      loading.textContent = "WebGL is required to play Runway Rewind.";
    };
    const resizeGame = CUSTOM_PARAMETERS.resize_window_callback;
    CUSTOM_PARAMETERS.resize_window_callback = () => runwayPlatform.resize(resizeGame);

    // Gate each follow-on engine/archive request, including a loader retry.
    const fileRequest = FileLoader.request;
    FileLoader.request = (...args) => {
      const request = fileRequest(...args);
      const send = request.send;
      request.send = () => runwayPlatform.whenActive().then(() => send.call(request));
      return request;
    };
    const streamWasm = EngineLoader.streamAndInstantiateWasmAsync;
    EngineLoader.streamAndInstantiateWasmAsync = (...args) =>
      runwayPlatform.whenActive().then(() => streamWasm.apply(EngineLoader, args));
    runwayPlatform.initialize().then(runwayPlatform.whenActive)
      .then(() => EngineLoader.load("canvas", "{{exe-name}}"));
  </script>
</body>
</html>
